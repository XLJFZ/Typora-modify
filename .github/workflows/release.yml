name: Publish Release

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/theme-check.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          tag=$(tr -d '\r\n' < VERSION)
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must contain vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Package themes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          zip -j "Typora-modify-$TAG.zip" themes/pure-black.css themes/pure-black-soft.css themes/pure-black-soft-serif.css themes/pdf-white.css README.md LICENSE
          unzip -t "Typora-modify-$TAG.zip"

      - name: Publish release with installation package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; choose a new VERSION instead of overwriting it."
            exit 1
          fi
          gh release create "$TAG" "Typora-modify-$TAG.zip" \
            --target "$GITHUB_SHA" \
            --title "$TAG — 主题检查与打印配色修复" \
            --notes-file RELEASE_NOTES.md \
            --latest
