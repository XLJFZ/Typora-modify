name: Theme Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 配色与结构检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Playwright（Python 包）
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: 读取 Playwright 版本
        id: pwver
        run: echo "v=$(pip show playwright | awk '/^Version/{print $2}')" >> "$GITHUB_OUTPUT"

      - name: 缓存 Chromium
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # key 带 playwright 版本：升级后自动换 key 重新缓存
          # （GitHub Actions 的 cache 不可变，固定 key 会让新版本永远写不进去）
          key: pw-${{ runner.os }}-${{ steps.pwver.outputs.v }}

      - name: 安装 Chromium 与系统依赖
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            echo "缓存命中：只补系统依赖，跳过 130MB 浏览器下载"
            playwright install-deps chromium
          else
            echo "缓存未命中：完整安装"
            playwright install --with-deps chromium
          fi

      - name: 静态审查（结构 / @import / 命名色 / 中灰背景）
        run: |
          set -e
          for f in themes/pure-black.css themes/pure-black-soft.css themes/pure-black-soft-serif.css; do
            echo "::group::$f"
            python scripts/review_theme.py --css "$f"
            echo "::endgroup::"
          done

      - name: 对比度审计（screen + print 双媒体）
        run: |
          set -e
          for f in themes/pure-black.css themes/pure-black-soft.css themes/pure-black-soft-serif.css; do
            echo "::group::$f"
            python scripts/audit_computed.py --css "$f" --browser chromium
            echo "::endgroup::"
          done

      - name: 安装清单完整性
        run: |
          set -e
          # 主题 @import 了 pdf-white.css，少一个文件导出 PDF 就会退回黑底
          for f in pure-black.css pure-black-soft.css pure-black-soft-serif.css pdf-white.css; do
            test -f "themes/$f" || { echo "::error::缺少 themes/$f"; exit 1; }
            echo "OK  themes/$f"
          done
          # README 里引用的预览图得真实存在
          for f in preview/screen.png preview/sample.pdf; do
            test -f "$f" || { echo "::error::缺少 $f"; exit 1; }
            echo "OK  $f"
          done
